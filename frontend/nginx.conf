# =============================================================================
# nginx.conf — front-door web server for the React app + reverse proxy to the
# Valhalla and Photon backends. This config is mounted into the nginx:alpine
# container by the frontend Dockerfile.
#
# Responsibilities, top to bottom:
#   1. Define rate-limit zones (per-IP buckets) for /api and /photon.
#   2. Enable gzip compression for text-like assets.
#   3. Inside one server block:
#        - security headers (CSP, frame-options, etc.)
#        - long-cache static assets
#        - short-cache index.html
#        - reverse proxy /api/route → valhalla:8002
#        - reverse proxy /photon/   → photon:2322
#        - SPA fallback so client-side routes hit index.html
# =============================================================================

# Per-IP rate-limit "leaky bucket" zones. 10m = ~160k IPs of state.
# api_limit:    routing endpoint — 10 requests/sec sustained per IP.
# photon_limit: geocoder         — 20 requests/sec (autocomplete fires fast).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=photon_limit:10m rate=20r/s;

# Compression for text payloads. Big win on JS/CSS/JSON responses.
# Skipping anything < 1 KB so we don't waste CPU on tiny assets.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
    listen 80;                  # SWAG terminates TLS in front of us.
    server_tokens off;          # don't leak nginx version in error pages
    client_max_body_size 16k;   # route requests are tiny JSON; cap to defeat abuse

    # --- Security headers, applied to every response -------------------------
    # nosniff: stop browsers from MIME-sniffing into executable types.
    add_header X-Content-Type-Options "nosniff" always;
    # DENY: refuse to be loaded inside any <iframe> (clickjacking defense).
    add_header X-Frame-Options "DENY" always;
    # Don't leak full URLs in Referer to other origins.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Browser feature gating: allow geolocation only for our own origin;
    # camera/microphone always denied.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # Content Security Policy — whitelist of where assets/connections may come from.
    #   default-src 'self'                       : everything from us unless overridden
    #   img-src ... tiles.openfreemap.org        : map tile images
    #   style-src 'self' 'unsafe-inline'         : MapLibre injects inline styles
    #   script-src 'self'                        : no third-party JS
    #   worker-src 'self' blob:                  : MapLibre uses Web Workers from blob URLs
    #   connect-src ... overpass-api.de          : scenic-waypoint Overpass queries
    #   font-src 'self' data:                    : data: URIs for icon fonts/SVGs
    #   frame-ancestors 'none'                   : same intent as X-Frame-Options: DENY
    #   base-uri 'self' / form-action 'self'     : misc hardening
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org https://overpass-api.de; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Long-cache static assets --------------------------------------------
    # Vite emits hashed filenames (e.g. App.abc123.js), so we can cache for a
    # year with `immutable`. Any code change produces a new hash and the
    # browser refetches automatically.
    location ~* \.(?:js|css|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html itself must NEVER be long-cached, otherwise users will be
    # stuck running old hashes after a deploy.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # --- Reverse proxy: routing API ------------------------------------------
    # /api/route → http://valhalla:8002/route (Docker network DNS resolves the
    # service name). burst=20 nodelay lets short bursts pass without delay
    # but enforces the 10 r/s steady-state rate.
    location = /api/route {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }      # Valhalla /route is POST-only
        proxy_pass http://valhalla:8002/route;
        proxy_set_header Host valhalla;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;              # long routes can take a while
    }

    # --- Reverse proxy: geocoder --------------------------------------------
    # /photon/... → http://photon:2322/... (trailing slashes matter; nginx
    # strips the /photon prefix when proxying).
    location /photon/ {
        limit_req zone=photon_limit burst=40 nodelay;
        limit_except GET { deny all; }       # Photon is read-only
        proxy_pass http://photon:2322/;
        proxy_set_header Host photon;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # --- SPA fallback --------------------------------------------------------
    # Try the literal file, then a directory index, otherwise serve index.html
    # so that future client-side routes (e.g. /share/...) still boot the app.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
